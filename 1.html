<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteXL Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        /* First Navigation Bar */
        .navbar {
            width: 100%;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 35px;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #70ad47;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333333;
            font-size: 15px;
            font-weight: 600;
        }

        .sign-in {
            background-color: #101e32;
            color: white;
            padding: 13px 22px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        /* Second Navigation Bar */
        .sub-navbar {
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            gap: 20px;
            border-bottom: 1px solid #eeeeee;
            overflow-x: auto;
        }

        .sub-navbar a {
            text-decoration: none;
            color: #333333;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .sub-navbar a:hover,
        .nav-links a:hover {
            color: #70ad47;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            .navbar {
                flex-wrap: wrap;
                gap: 20px;
                padding: 20px;
            }

            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
            }

            .sub-navbar {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="logo">ByteXL</div>

            <div class="nav-links">
                <a href="#">Courses</a>
                <a href="#">Tutorials</a>
                <a href="#">Practice</a>
                <a href="#">Jobs</a>
            </div>

            <a href="#" class="sign-in">Sign In</a>
        </nav>

        <nav class="sub-navbar">
            <a href="#">DSA</a>
            <a href="#">Practice Problems</a>
            <a href="#">C</a>
            <a href="#">C++</a>
            <a href="#">Java</a>
            <a href="#">Python</a>
            <a href="#">JavaScript</a>
            <a href="#">Data Science</a>
            <a href="#">Machine Learning</a>
            <a href="#">Courses</a>
            <a href="#">Linux</a>
            <a href="#">DevOps</a>
        </nav>
    </header>

</body>
</html>
